name: Publish scheduled insights

on:
  schedule:
    # 14:17 UTC publishes in the morning in Indianapolis and avoids the busy hour boundary.
    - cron: "17 14 1,15,29 9 *"
    - cron: "17 14 13,27 10 *"
    - cron: "17 14 10,24 11 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-scheduled-insights
  cancel-in-progress: false

jobs:
  trigger-cloudflare-build:
    name: Trigger Cloudflare Pages build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm this is an approved publication date
        id: publication-date
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          case "$(date -u +%F)" in
            2026-09-01|2026-09-15|2026-09-29|2026-10-13|2026-10-27|2026-11-10|2026-11-24)
              echo "Approved Insight publication date confirmed."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "This recurring cron date is outside the approved 2026 campaign; no deployment will run."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Trigger the production deployment
        if: github.event_name == 'workflow_dispatch' || steps.publication-date.outputs.publish == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::The CLOUDFLARE_DEPLOY_HOOK_URL repository secret is not configured."
            exit 1
          fi

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            "$CLOUDFLARE_DEPLOY_HOOK_URL"
